# 本番用の差分。docker-compose.yml と併せて明示指定する。task prod:* を参照。
services:
  app:
    restart: unless-stopped

  db:
    restart: unless-stopped

  redis:
    restart: unless-stopped

  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    restart: unless-stopped

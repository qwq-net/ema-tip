# 本番用の差分。docker-compose.yml と併せて明示指定する。task prod:* を参照。

# ログの無制限肥大でディスクを埋めないよう全サービスでローテーションする
x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: '3'

# メモリ上限は実測にもとづく保険。本番アプリは負荷時でも400MB強で安定しており、
# 万一の異常増加時は OOM kill と restart で自己回復させ、VM 全体を巻き込ませない
services:
  app:
    restart: unless-stopped
    mem_limit: 1g
    <<: *logging

  db:
    restart: unless-stopped
    mem_limit: 512m
    <<: *logging

  redis:
    restart: unless-stopped
    mem_limit: 256m
    <<: *logging

  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    restart: unless-stopped
    mem_limit: 128m
    <<: *logging

name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint / Type / Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run checks
        run: pnpm check

      - name: Build
        run: pnpm build
        env:
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
          REDIS_URL: redis://localhost:6379

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      db:
        image: postgres:18-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: webapp
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:password@localhost:5432/webapp
      REDIS_URL: redis://localhost:6379
      AUTH_SECRET: dummy-ci-secret
      NEXTAUTH_URL: http://localhost:3000
      RUN_SLOW_TESTS: '1'

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Database
        run: |
          pnpm drizzle-kit push
          pnpm tsx src/shared/db/seed.ts

      - name: Run Tests
        run: pnpm test

  # 本番イメージは CI のユニットテストでは動かないため、ここでビルドして起動まで確かめる。
  # pnpm 11 の既定変更で非 root の本番イメージが pnpm start で落ちた事故があり、
  # 実行ユーザーや pnpm の設定を触った時の唯一の自動検知になる
  image:
    name: Production Image Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROD: docker compose -f docker-compose.yml -f docker-compose.prod.yml
    steps:
      - uses: actions/checkout@v6

      - name: Create env file
        run: printf 'AUTH_SECRET=dummy-ci-secret\nNEXTAUTH_URL=http://localhost:3000\n' > .env

      - name: Build and start production stack
        run: $PROD up -d --build app db redis

      - name: Apply schema with the production image
        run: $PROD run --rm --no-deps app pnpm drizzle-kit push

      - name: Wait for every app container to serve /login
        run: |
          for index in 1 2; do
            ok=0
            for i in $(seq 1 20); do
              if $PROD exec -T --index "$index" app node -e "fetch('http://localhost:3000/login',{redirect:'manual'}).then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))"; then
                ok=1
                break
              fi
              sleep 3
            done
            if [ "$ok" != 1 ]; then
              echo "app-$index did not become ready" >&2
              $PROD logs app | tail -50
              exit 1
            fi
            echo "app-$index ok"
          done

  # 画面の退行は E2E でしか捕まえられないため push ごとに回す。
  # dev 構成の compose を起こし、Playwright 公式イメージの e2e サービスから localhost:3000 を叩く
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Create env file
        run: printf 'AUTH_SECRET=dummy-ci-secret\nNEXTAUTH_URL=http://localhost:3000\n' > .env

      - name: Start services
        run: docker compose up -d app db redis

      - name: Wait for app
        run: |
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:3000/login; then exit 0; fi
            sleep 5
          done
          echo 'app did not become ready' >&2
          docker compose logs app | tail -50
          exit 1

      - name: Setup database
        run: |
          docker compose exec -T app pnpm drizzle-kit push
          docker compose exec -T app pnpm tsx src/shared/db/seed.ts --master-only

      - name: Run E2E
        run: docker compose run --rm e2e

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

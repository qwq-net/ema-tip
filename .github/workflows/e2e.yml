name: E2E

# 実行時間が長くブラウザ操作を伴うため、通常のCIから分離して手動実行にしている。
# リリース前の確認や大きな導線変更時に回す想定
on:
  workflow_dispatch:

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Start services
        run: docker compose up -d app db redis

      - name: Wait for app
        run: |
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:3000/login; then exit 0; fi
            sleep 5
          done
          echo 'app did not become ready' >&2
          docker compose logs app | tail -50
          exit 1

      - name: Setup database
        run: |
          docker compose exec -T app pnpm drizzle-kit push
          docker compose exec -T app pnpm tsx src/shared/db/seed.ts --master-only

      - name: Run E2E
        run: docker compose run --rm e2e

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

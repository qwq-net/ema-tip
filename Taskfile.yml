version: '3'

vars:
  # CI環境では -T を付け、ローカルでは外す
  TTY: '{{if .CI}}-T{{else}}{{end}}'
  # 本番は override を読ませず prod 差分を明示指定する
  PROD: docker compose -f docker-compose.yml -f docker-compose.prod.yml

tasks:
  default:
    cmds:
      - task --list

  # ── Docker ─────────────────────────────────────────────────────
  up:
    desc: Cloudflare Tunnel を含む開発コンテナを起動します
    cmds:
      - docker compose --profile dev up -d

  down:
    desc: 開発コンテナを停止します
    cmds:
      - docker compose --profile dev down

  clean:
    desc: ボリュームごと破棄して再ビルドします
    cmds:
      - docker compose --profile dev down -v
      - docker compose --profile dev up -d --build

  logs:tunnel:
    desc: Cloudflare TunnelのログURLを確認します
    cmds:
      - docker compose --profile dev logs tunnel

  # ── アプリケーション ───────────────────────────────────────────
  run:
    desc: 'コンテナ内で任意のpnpmコマンドを実行します。例: task run -- build'
    cmds:
      - docker compose exec {{.TTY}} app pnpm {{.CLI_ARGS}}

  test:
    desc: 重いテストをスキップしてテストを実行します
    cmds:
      - docker compose exec {{.TTY}} app sh -lc "RUN_SLOW_TESTS=0 pnpm test {{.CLI_ARGS}}"

  test:full:
    desc: 重いテストを含むすべてのテストを実行します
    cmds:
      - docker compose exec {{.TTY}} app sh -lc "RUN_SLOW_TESTS=1 pnpm test {{.CLI_ARGS}}"

  check:
    desc: Lint・型チェック・フォーマットチェックを実行します
    cmds:
      - docker compose exec {{.TTY}} app pnpm check

  check:fix:
    desc: Lintとフォーマットの自動修正を実行します
    cmds:
      - docker compose exec {{.TTY}} app pnpm check:fix

  # ── データベース ───────────────────────────────────────────────
  db:setup:
    desc: スキーマ反映とシード投入を実行します
    cmds:
      - docker compose exec {{.TTY}} app pnpm drizzle-kit push
      - docker compose exec {{.TTY}} app pnpm tsx src/shared/db/seed.ts

  db:reset:
    desc: データベースをリセットします
    cmds:
      - docker compose exec {{.TTY}} app pnpm tsx src/shared/db/reset.ts

  db:seed:
    desc: シードデータを投入します。--master-only を付けるとマスタのみ投入します
    cmds:
      - docker compose exec {{.TTY}} app pnpm tsx src/shared/db/seed.ts {{.CLI_ARGS}}

  db:role:
    desc: ユーザーのロールを変更します
    cmds:
      - docker compose exec {{.TTY}} app pnpm tsx src/shared/db/set-role.ts {{.CLI_ARGS}}

  db:reconcile:
    desc: 残高と取引台帳の整合性を読み取りのみで突合します
    cmds:
      - docker compose exec {{.TTY}} app pnpm tsx src/shared/db/reconcile.ts

  db:backup:
    desc: 'DBをカスタム形式でダンプします。例: task db:backup > backup.dump'
    cmds:
      - docker compose exec -T db pg_dump -U postgres -d webapp --format=custom

  db:restore:
    desc: 'ダンプからDBを復元します。復元後は db:reconcile で整合確認を推奨。例: task db:restore < backup.dump'
    cmds:
      - docker compose exec -T db pg_restore -U postgres -d webapp --clean --if-exists

  db:audit-log:
    desc: 管理操作の監査ログを新しい順に50件表示します
    cmds:
      - docker compose exec -T db psql -U postgres -d webapp -c "SELECT created_at, actor_name, action, target_id, detail FROM admin_action_log ORDER BY created_at DESC LIMIT 50;"

  # ── パフォーマンス計測 ─────────────────────────────────────────
  perf:stats:
    desc: クエリ別の実行統計を合計時間の降順で表示します
    cmds:
      - docker compose exec -T db psql -U postgres -d webapp -c "CREATE EXTENSION IF NOT EXISTS pg_stat_statements;"
      - docker compose exec -T db psql -U postgres -d webapp -c "SELECT calls, round(total_exec_time::numeric, 1) AS total_ms, round(mean_exec_time::numeric, 2) AS mean_ms, round(max_exec_time::numeric, 1) AS max_ms, rows, left(regexp_replace(query, E'\\s+', ' ', 'g'), 100) AS query FROM pg_stat_statements WHERE query NOT ILIKE '%pg_stat_statements%' ORDER BY total_exec_time DESC LIMIT 25;"

  perf:stats:reset:
    desc: クエリ統計をリセットします。計測シナリオの直前に実行します
    cmds:
      - docker compose exec -T db psql -U postgres -d webapp -c "SELECT pg_stat_statements_reset();"

  perf:setup:
    desc: 負荷計測用のユーザー30人・イベント・レース・ウォレットを作り直します
    cmds:
      - docker compose exec {{.TTY}} app pnpm tsx tools/perf/setup.ts

  perf:load:
    desc: '負荷シナリオを実行します。例: task perf:load -- bets sse pages payout'
    cmds:
      - docker compose exec {{.TTY}} app pnpm tsx tools/perf/load.ts {{.CLI_ARGS}}

  perf:clean:
    desc: 負荷計測用のデータを削除します
    cmds:
      - docker compose exec -T db psql -U postgres -d webapp -c "DELETE FROM event WHERE name = 'PERF検証イベント'; DELETE FROM \"user\" WHERE name = 'PERF管理者' OR name LIKE 'PERF利用者%'; DELETE FROM horse WHERE name LIKE 'PERF馬%'; DELETE FROM venue WHERE name = 'PERF競馬場';"

  # 本番イメージは tools/ を含まないため、リポジトリの tools/ をマウントして実行する
  perf:setup:prod:
    desc: 'VM上の本番構成で負荷計測フィクスチャを作ります。例: PERF_HISTORY=20 task perf:setup:prod'
    cmds:
      - '{{.PROD}} run --rm -v ./tools:/app/tools -e PERF_HISTORY app pnpm tsx tools/perf/setup.ts'

  perf:load:prod:
    desc: 'VM上の本番構成で負荷シナリオを実行します。例: task perf:load:prod -- bets sse pages payout'
    cmds:
      - '{{.PROD}} run --rm -v ./tools:/app/tools -e PERF_BASE_URL=http://app:3000 app pnpm tsx tools/perf/load.ts {{.CLI_ARGS}}'

  test:e2e:
    desc: E2Eテストを実行します。app/db/redis が起動済みでシード投入済みであることが前提です
    cmds:
      - docker compose run --rm e2e

  # ── 本番環境: VM上で実行 ──────────────────────────────────────
  prod:up:
    desc: VM上で本番環境を起動・更新します
    cmds:
      - git pull origin main
      - '{{.PROD}} build app'
      - '{{.PROD}} up -d --remove-orphans'

  prod:migrate:
    desc: VM上で本番環境のDBマイグレーションを実行します。実行前に backups/ へダンプを保存します
    cmds:
      # drizzle-kit push はカラム削除を伴い得るため、直前のダンプを保険として残す
      - mkdir -p backups
      - docker compose exec -T db pg_dump -U postgres -d webapp --format=custom > backups/pre-migrate-$(date +%Y%m%d-%H%M%S).dump
      - '{{.PROD}} run --rm app pnpm drizzle-kit push'

  prod:down:
    desc: VM上で本番環境のコンテナを停止します
    cmds:
      - '{{.PROD}} down'

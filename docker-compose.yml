# 共通定義。開発時は docker-compose.override.yml が自動で重なる。
# 本番は docker-compose.prod.yml を明示指定する。task prod:* を参照。
services:
  app:
    build: .
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/webapp
      - REDIS_URL=redis://redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  db:
    image: postgres:18-alpine
    # pg_stat_statements でクエリ別統計を常時収集し、100ms超のクエリをログに残す。
    # 参照は task perf:stats、リセットは task perf:stats:reset
    command: postgres -c shared_preload_libraries=pg_stat_statements -c pg_stat_statements.track=all -c log_min_duration_statement=100
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: webapp
    volumes:
      # 18 以降の公式イメージはデータを /var/lib/postgresql/<major>/docker に置く。
      # 15 のボリューム db-data は復元確認後に docker volume rm で削除する
      - db-data-18:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d webapp']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    volumes:
      - redis-data:/data

volumes:
  db-data:
  db-data-18:
  redis-data:

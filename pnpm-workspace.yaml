# pnpm 11 は package.json の pnpm フィールドを読まないため、overrides はここに置く。
# @auth/core は next-auth との整合ピン。esbuild / postcss / sharp は transitive の CVE 対応。
# 棚卸しは pnpm audit で確認する
overrides:
  '@auth/core': 0.41.3
  'esbuild@<0.25.0': ^0.28.2
  postcss: ^8.5.23
  sharp: ^0.35.0

# pnpm 11 は依存の build スクリプトを許可か拒否で明示しないと install が失敗する。
# esbuild と unrs-resolver の postinstall はプラットフォーム別バイナリの検証で、
# optionalDependencies で同じバイナリが入るため実行しなくても動く。pnpm 10 でも既定で未実行だった
allowBuilds:
  esbuild: false
  unrs-resolver: false
